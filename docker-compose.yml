services:
  zappa:
    build: .
    volumes:
      # Mount AWS credentials from host
      - ~/.aws:/root/.aws:ro
      # Mount current workspace for live code
      - .:/app
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - SQLITE_S3_BUCKET=${SQLITE_S3_BUCKET}
      - USE_S3_SQLITE=true
    command: ["status", "dev"]
